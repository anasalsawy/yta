# YTA stock-Hermes Render agent config
# Home: Telegram. Scan: FB + Instagram + WhatsApp every 1 min via cron job.
# LLM: zai GLM (GLM-5.3-Flash) served through Featherless (OpenAI-compatible).
# Telegram token is read from env TELEGRAM_BOT_TOKEN (set in Render env, not repo).

model:
  provider: custom                 # OpenAI-compatible endpoint
  base_url: https://api.featherless.ai/v1
  default: zai-org/GLM-5.3-Flash
  max_tokens: 16384                # well above GLM's native cap → never truncate

# Cron agent must be able to run its tools (scripts/yta_send.py, poller) even
# though there is no interactive user present to approve each flagged call.
approvals:
  cron_mode: approve

# Full tool stack for the deployed agent: web search/exa, browser-use, github.
web:
  backend: exa
browser:
  backend: browser-use
  inactivity_timeout: 120
  extension_control:
    enabled: false