# YTA stock-Hermes Render agent config
# Home: Telegram. Scan: FB + Instagram + WhatsApp every 1 min via cron job.
# LLM: zai GLM (GLM-5.3-Flash) served through Featherless (OpenAI-compatible).

model:
  provider: custom                 # OpenAI-compatible endpoint
  base_url: https://api.featherless.ai/v1
  default: zai-org/GLM-5.3-Flash
  # api_key supplied via .env (bridged as the custom-provider API key)

gateway:
  telegram:
    bot_token: "${TELEGRAM_BOT_TKN}"   # substituted from .env at boot

platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: "${RESERVATIONS_TELEGRAM_CHAT_ID}"   # Anas's supervisory chat

agent:
  max_turns: 150
  # No Alaska tools; the agent answers all but quotes/bookings, escalating to Anas.